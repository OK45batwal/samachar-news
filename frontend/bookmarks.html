<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Bookmarks — Samachar</title>
  <meta name="description" content="Your saved news articles and research archive." />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <script>
    const savedTheme = localStorage.getItem('samachar_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-main">
      <div class="flex items-center gap-4">
        <a href="home.html" class="logo">
          <span>SAMACHAR</span><span class="logo-dot"></span>
          <span class="logo-tag">TRUTH FIRST</span>
        </a>
      </div>

      <div class="flex items-center gap-3">
        <a href="home.html" class="btn btn-ghost btn-sm">Home</a>
        <a href="latest.html" class="btn btn-ghost btn-sm">All News</a>
        <button id="themeToggle" class="btn btn-icon btn-ghost" title="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <div id="headerAuth" class="flex items-center gap-2"></div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container py-8" style="max-width: 960px; margin: 0 auto;">
    <div class="mb-6">
      <span class="badge badge-verified mb-1">📌 SAVED ARCHIVE</span>
      <h1 class="heading-lg">Your Bookmarks</h1>
      <p class="text-xs text-secondary">Saved verified articles and research stories</p>
    </div>

    <div id="bookmarksList" class="news-grid">
      <!-- Injected dynamically -->
    </div>
  </main>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      const listEl = document.getElementById('bookmarksList');
      try {
        const bookmarks = await getBookmarks();
        if (bookmarks && bookmarks.length) {
          listEl.innerHTML = bookmarks.map(b => b.article ? renderNewsCard(b.article) : '').join('');
        } else {
          listEl.innerHTML = '<div class="p-8 text-center text-secondary w-full" style="grid-column:1/-1">You have no saved bookmarks yet. <br><a href="latest.html" class="text-accent font-semibold mt-2 inline-block">Browse Verified News &rarr;</a></div>';
        }
      } catch (err) {
        listEl.innerHTML = `<div class="p-4 text-danger w-full" style="grid-column:1/-1">Failed to load bookmarks: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign In — Samachar</title><link rel="stylesheet" href="assets/css/variables.css?v=1"><link rel="stylesheet" href="assets/css/style.css?v=1"><link rel="stylesheet" href="assets/css/layout.css?v=1"><link rel="icon" href="assets/icons/favicon.svg?v=1" type="image/svg+xml">
<style>
.auth-container { min-height:100vh; display:flex; background:var(--bg-primary); }
.auth-form-side { flex:1; display:flex; flex-direction:column; justify-content:center; padding:48px; max-width:480px; margin:0 auto; }
.auth-hero { flex:1; background: linear-gradient(135deg, var(--accent-dim) 0%, transparent 100%); display:flex; flex-direction:column; justify-content:center; padding:64px; position:relative; overflow:hidden; }
.auth-hero::before { content:''; position:absolute; top:-50%; right:-30%; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle, var(--accent-dim) 0%, transparent 70%); }
@media (max-width:768px) { .auth-hero { display:none; } .auth-form-side { padding:24px; } }
.input-group { margin-bottom:20px; }
.input-group label { display:block; font-size:13px; font-weight:600; color:var(--text-primary); margin-bottom:6px; }
.input-group .input { width:100%; }
.input-wrap { position:relative; }
.input-wrap .input { padding-right:40px; width:100%; }
.input-reveal { position:absolute; right:8px; top:50%; transform:translateY(-50%); padding:6px; color:var(--text-tertiary); display:flex; align-items:center; background:none; border:none; cursor:pointer; border-radius:4px; transition:color 0.2s; }
.input-reveal:hover { color:var(--text-primary); }
.input-hint { font-size:11px; color:var(--text-tertiary); margin-top:4px; }
.form-footer { text-align:center; margin-top:24px; font-size:13px; color:var(--text-tertiary); }
</style></head><body>
<div class="auth-container">
  <div class="auth-form-side">
    <div style="margin-bottom:32px"><a href="home.html" class="logo" style="font-size:18px"><img src="assets/images/logo.png?v=1" alt="Samachar" width="24" height="24" /><span>Samachar</span></a></div>
    <h1 style="font-size:28px;font-weight:700;margin-bottom:4px">Welcome back</h1>
    <p class="text-muted text-sm" style="margin-bottom:32px">Sign in to your account to continue</p>

    <form id="loginForm">
      <div class="input-group"><label>Email</label><input id="loginEmail" type="email" class="input" placeholder="you@example.com" required></div>
      <div class="input-group"><label>Password</label><div class="input-wrap"><input id="loginPassword" type="password" class="input" placeholder="••••••••" required><button type="button" class="input-reveal" onclick="togglePassword(this)" aria-label="Show password"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="input-hint flex justify-between"><span></span><a href="forgot-password.html" style="font-size:12px;color:var(--accent)">Forgot password?</a></div></div>
      <div id="loginError" style="color:var(--danger);font-size:13px;margin-bottom:12px;display:none"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:15px">Sign In</button>
    </form>

    <div class="form-footer">Don't have an account? <a href="register.html">Create one</a></div>
  </div>
  <div class="auth-hero">
    <div style="position:relative;z-index:1;max-width:360px">
      <h2 style="font-size:24px;font-weight:700;margin-bottom:12px">Stay informed with Samachar</h2>
      <p style="color:var(--text-secondary);line-height:1.6">Get real-time news, AI-powered insights, and in-depth analysis from trusted sources worldwide.</p>
    </div>
  </div>
</div>
<script src="assets/js/layout.js?v=1"></script>
<script src="assets/js/api.js?v=1"></script>
<script>
function togglePassword(btn) {
  const input = btn.parentElement.querySelector('input');
  const hidden = input.type === 'password';
  input.type = hidden ? 'text' : 'password';
  btn.innerHTML = hidden
    ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'
    : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
}
document.getElementById('loginForm')?.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector('button[type="submit"]');
  btn.textContent = 'Signing in...';
  btn.disabled = true;
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  try {
    await login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
    window.location.href = 'home.html';
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.textContent = 'Sign In';
    btn.disabled = false;
  }
});
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090C" />
  <title>Create Free Account — Samachar Truth Intelligence</title>
  <meta name="description" content="Join Samachar for truth-first news intelligence and claim verification." />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/favicon.svg" />
  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <script>
    const savedTheme = localStorage.getItem('samachar_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Header -->
  <header class="header">
    <div class="container header-main">
      <a href="index.html" class="logo">
        <span>SAMACHAR</span><span class="logo-dot"></span>
        <span class="logo-tag">TRUTH FIRST</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="login.html" class="btn btn-ghost btn-sm">Sign In</a>
        <button id="themeToggle" class="btn btn-icon btn-ghost" title="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Centered Auth Card Wrapper -->
  <main class="auth-page-wrapper">
    <div class="auth-card-clean">
      
      <div class="text-center mb-6">
        <span class="badge badge-verified mb-2">FREE ONBOARDING</span>
        <h1 class="heading-lg mb-1">Create Account</h1>
        <p class="text-xs text-secondary">Join readers accessing verified news intelligence</p>
      </div>

      <form id="registerForm">
        <div class="form-group mb-4">
          <label class="form-label font-semibold">Full Name</label>
          <input type="text" id="nameInput" class="input" placeholder="Alex Mercer" required autocomplete="name" />
        </div>

        <div class="form-group mb-4">
          <label class="form-label font-semibold">Email Address</label>
          <input type="email" id="emailInput" class="input" placeholder="you@example.com" required autocomplete="email" />
        </div>

        <div class="form-group mb-4">
          <label class="form-label font-semibold">Password (min 8 characters)</label>
          <input type="password" id="passwordInput" class="input" placeholder="••••••••" required minlength="8" autocomplete="new-password" />
        </div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-full mb-4" style="padding: 11px;">
          Create Free Account &rarr;
        </button>
      </form>

      <div class="text-center text-xs text-secondary pt-4 border-top">
        Already have an account? <a href="login.html" class="text-accent font-semibold hover:underline">Sign in &rarr;</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" style="padding: 20px 0;">
    <div class="container text-center text-xs text-muted">
      &copy; 2026 Samachar News Platform · Truth First
    </div>
  </footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('nameInput').value.trim();
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Creating Account...';

        try {
          await registerUser(email, password, fullName);
          showToast('Account created! Signing you in...', 'success');
          await loginUser(email, password);
          setTimeout(() => { window.location.href = 'home.html'; }, 600);
        } catch (err) {
          showToast(err.message || 'Registration failed', 'error');
          btn.disabled = false;
          btn.textContent = 'Create Free Account →';
        }
      });
    });
  </script>
</body>
</html>

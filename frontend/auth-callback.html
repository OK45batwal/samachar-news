<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Redirecting…</title><style>body{display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0a0a0f;color:#fff;font-family:system-ui,sans-serif;font-size:14px;}.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.1);border-top-color:#6c5ce7;border-radius:50%;animation:spin .6s linear infinite;margin-right:12px;}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div style="display:flex;align-items:center"><div class="spinner"></div><span>Completing sign in…</span></div>
<script src="assets/js/api.js?v=3"></script>
<script>
(async function(){
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  const provider = params.get('thirdPartyId');
  if (!code || !provider) {
    document.body.innerHTML = '<p style="color:var(--danger)">Invalid callback — missing code or provider.</p><a href="login.html" style="color:var(--accent)">Back to login</a>';
    return;
  }
  try {
    const data = await api('/auth/signinup', {
      method: 'POST',
      body: {
        thirdPartyId: provider,
        code,
        redirectURI: window.location.origin + '/auth-callback.html',
      },
    });
    if (data.status !== 'OK') throw new Error(data.status);
    const user = await getMe();
    localStorage.setItem('samachar_user', JSON.stringify(user));
    window.location.href = 'home.html';
  } catch (err) {
    document.body.innerHTML = '<p style="color:var(--danger)">Sign in failed: ' + err.message + '</p><a href="login.html" style="color:var(--accent)">Try again</a>';
  }
})();
</script></body></html>

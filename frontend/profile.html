<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile & Preferences — Samachar</title>
  <meta name="description" content="Manage your Samachar account and truth feed preferences." />
  <meta name="theme-color" content="#08090C" />
  <link rel="stylesheet" href="/assets/css/variables.css?v=2.1" />
  <link rel="stylesheet" href="/assets/css/style.css?v=2.1" />
  <link rel="stylesheet" href="/assets/css/layout.css?v=2.1" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/favicon.svg" />
  <script>
    const savedTheme = localStorage.getItem('samachar_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-main">
      <div class="flex items-center gap-4">
        <a href="home.html" class="logo">
          <span>SAMACHAR</span><span class="logo-dot"></span>
          <span class="logo-tag">TRUTH FIRST</span>
        </a>
      </div>

      <div class="flex items-center gap-3">
        <a href="home.html" class="btn btn-ghost btn-sm">Home</a>
        <a href="latest.html" class="btn btn-ghost btn-sm">All News</a>
        <button id="themeToggle" class="btn btn-icon btn-ghost" title="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <div id="headerAuth" class="flex items-center gap-2"></div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container py-8" style="max-width: 680px; margin: 32px auto 64px;">
    <div class="card p-8">
      <div class="flex items-center gap-4 mb-6 pb-6 border-bottom">
        <div style="width:64px;height:64px;border-radius:50%;background:var(--accent);color:#07090E;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center" id="profileAvatar">U</div>
        <div>
          <h1 class="heading-md" id="profileName">Loading Profile...</h1>
          <p class="text-xs text-secondary" id="profileEmail">user@example.com</p>
          <span class="badge badge-verified mt-2" id="profileRole">MEMBER</span>
        </div>
      </div>

      <div class="flex flex-col gap-4 mb-8">
        <div class="flex items-center justify-between p-3 card" style="background:var(--bg-elevated)">
          <div>
            <div class="text-sm font-semibold">Feed Mode</div>
            <div class="text-xs text-secondary">Default to Verified Stories only (85%+ Truth Score)</div>
          </div>
          <input type="checkbox" checked style="accent-color:var(--accent)" />
        </div>
      </div>

      <button onclick="logoutUser()" class="btn btn-secondary w-full">Sign Out Account</button>
    </div>
  </main>

  <script src="/assets/js/api.js?v=2.1"></script>
  <script src="/assets/js/layout.js?v=2.1"></script>
  <script src="/assets/js/app.js?v=2.1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = getUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('profileName').textContent = user.full_name || user.username;
      document.getElementById('profileEmail').textContent = user.email;
      document.getElementById('profileAvatar').textContent = (user.full_name || user.username)[0].toUpperCase();
      document.getElementById('profileRole').textContent = (user.role || 'USER').toUpperCase();
    });
  </script>
</body>
</html>

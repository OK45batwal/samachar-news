<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Samachar</title>
  <meta name="description" content="Reset your Samachar account password." />
  <meta name="theme-color" content="#08090C" />
  <link rel="stylesheet" href="assets/css/variables.css?v=2.1" />
  <link rel="stylesheet" href="assets/css/style.css?v=2.1" />
  <link rel="stylesheet" href="assets/css/layout.css?v=2.1" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/favicon.svg" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <a href="home.html" class="logo">
        <span>SAMACHAR</span><span class="logo-dot"></span>
        <span class="logo-tag">TRUTH FIRST</span>
      </a>
      <a href="login.html" class="btn btn-ghost btn-sm">Back to Login</a>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container" style="max-width: 440px; margin: 48px auto 64px;">
    <div class="card p-8" id="cardContainer">
      <div class="text-center mb-6">
        <h1 class="heading-md mb-1">Reset Password</h1>
        <p class="text-xs text-secondary">Enter your email to receive a password reset authorization</p>
      </div>

      <form id="forgotForm">
        <div class="form-group mb-4">
          <label class="form-label">Email Address</label>
          <input type="email" id="emailInput" class="input" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <button type="submit" id="submitBtn" class="btn btn-primary w-full">Send Reset Link</button>
      </form>
    </div>
  </main>

  <script src="assets/js/api.js?v=2.1"></script>
  <script src="assets/js/layout.js?v=2.1"></script>
  <script src="assets/js/app.js?v=2.1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      const container = document.getElementById('cardContainer');

      if (token) {
        // Reset password form
        container.innerHTML = `
          <div class="text-center mb-6">
            <h1 class="heading-md mb-1">Set New Password</h1>
            <p class="text-xs text-secondary">Enter your new secure password below</p>
          </div>
          <form id="resetForm">
            <div class="form-group mb-4">
              <label class="form-label">New Password (min 8 chars)</label>
              <input type="password" id="newPwdInput" class="input" placeholder="••••••••" required minlength="8" />
            </div>
            <button type="submit" id="resetBtn" class="btn btn-primary w-full">Update Password</button>
          </form>
        `;

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const newPassword = document.getElementById('newPwdInput').value;
          const btn = document.getElementById('resetBtn');
          btn.disabled = true;
          btn.textContent = 'Updating...';
          try {
            await resetPassword(token, newPassword);
            container.innerHTML = `
              <div class="text-center py-4">
                <span class="badge badge-verified mb-2">SUCCESS</span>
                <h3 class="heading-md mb-2">Password Updated!</h3>
                <p class="text-xs text-secondary mb-4">You can now sign in with your new credentials.</p>
                <a href="login.html" class="btn btn-primary btn-sm">Go to Login</a>
              </div>
            `;
          } catch (err) {
            showToast(err.message || 'Reset failed', 'error');
            btn.disabled = false;
            btn.textContent = 'Update Password';
          }
        });
      } else {
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          const email = document.getElementById('emailInput').value.trim();
          const btn = document.getElementById('submitBtn');
          btn.disabled = true;
          btn.textContent = 'Sending...';
          try {
            const res = await forgotPassword(email);
            const resetLink = res.reset_token ? `<div class="mt-3 p-2 card text-xs" style="background:var(--bg-elevated);word-break:break-all"><span class="text-accent font-semibold">Demo Quick Reset Link:</span><br><a href="forgot-password.html?token=${res.reset_token}" class="text-accent">Click here to set new password now &rarr;</a></div>` : '';
            container.innerHTML = `
              <div class="text-center py-4">
                <span class="badge badge-verified mb-2">LINK DISPATCHED</span>
                <h3 class="heading-md mb-2">Check Your Email</h3>
                <p class="text-xs text-secondary">${res.message || 'If an account exists, a reset link has been dispatched.'}</p>
                ${resetLink}
                <a href="login.html" class="btn btn-secondary btn-sm mt-4">Back to Login</a>
              </div>
            `;
          } catch (err) {
            showToast(err.message || 'Failed to dispatch reset', 'error');
            btn.disabled = false;
            btn.textContent = 'Send Reset Link';
          }
        });
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Article — Samachar</title><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/layout.css"><link rel="icon" href="assets/icons/favicon.svg"></head><body>
<header class="header"><div class="header-inner container">
  <div class="header-left">
    <button id="sidebarToggle" class="btn btn-icon btn-ghost hide-desktop"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg></button>
    <a href="index.html" class="logo"><img src="assets/images/logo.png" alt="Samachar" width="24" height="24" /><span>Samachar</span></a>
    <nav class="nav-links hide-mobile"><a href="index.html">Home</a><a href="latest.html">Latest</a><a href="map.html">World Map</a><a href="live.html">Live TV</a><a href="ai.html">AI Insights</a></nav>
  </div>
  <div class="header-right">
    <button id="searchToggle" class="btn btn-icon btn-ghost"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></button>
    <a href="login.html" class="btn btn-ghost btn-sm hide-mobile">Sign In</a><a href="register.html" class="btn btn-primary btn-sm">Get Started</a>
  </div>
</div></header>

<div id="sidebarOverlay" class="sidebar-overlay"></div>
<aside id="sidebar" class="sidebar">[sidebar content same as index]</aside>

<section class="page-wrapper">
  <div class="article-hero">
    <div class="skeleton" style="width:100%;height:100%"></div>
    <div class="article-hero-overlay"></div>
    <div class="article-hero-content container">
      <div class="flex items-center gap-2 mb-3">
        <span class="badge badge-accent" id="articleCategory">World</span>
        <span class="text-xs text-muted" id="articleTime">15 min ago</span>
      </div>
      <h1 class="heading-lg" id="articleTitle" style="max-width:800px">Loading...</h1>
    </div>
  </div>

  <div class="container" style="padding-top:24px">
    <div class="grid" style="grid-template-columns:1fr 300px;gap:32px">
      <article>
        <div class="flex items-center gap-3 text-sm text-muted mb-6">
          <span>By <strong style="color:var(--text-primary)" id="articleSource">Reuters</strong></span>
          <span>·</span>
          <span id="articleReadTime">4 min read</span>
        </div>
        <p class="text-lg" style="color:var(--text-secondary);line-height:1.8;margin-bottom:24px" id="articleSummary"></p>
        <div class="article-content" style="color:var(--text-secondary);line-height:1.8;font-size:15px" id="articleContent"></div>

        <div class="flex items-center gap-2 mt-8">
          <button class="btn btn-secondary btn-sm" onclick="toggleBookmark(1)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg> Save</button>
          <button class="btn btn-secondary btn-sm" onclick="shareArticle(document.title)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share</button>
        </div>
      </article>

      <aside>
        <div class="card p-4 mb-4">
          <h4 class="font-semibold text-sm mb-3">AI Summary</h4>
          <p class="text-sm text-muted" id="articleAiSummary">Loading AI analysis...</p>
        </div>
        <h4 class="font-semibold text-sm mb-3">Related Articles</h4>
        <div class="flex flex-col gap-3" id="relatedArticles"></div>
      </aside>
    </div>
  </div>
</section>

<footer class="footer" style="margin-top:48px"><div class="container">
  <div class="footer-bottom"><span class="text-xs text-muted">© 2026 Samachar News. All rights reserved.</span></div>
</div></footer>

<script src="assets/js/layout.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
</body></html>

name: Automated News Ingestion & Fact-Checking

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs every 30 minutes
  workflow_dispatch:        # Allows manual trigger from GitHub UI

jobs:
  sync_news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Live News Feed Ingestion
        run: |
          echo "Triggering live news wire synchronization..."
          curl -X POST https://samachar-news-api.onrender.com/api/news/sync || echo "API sync triggered"

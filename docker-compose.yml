services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: samachar
      POSTGRES_PASSWORD: samachar
      POSTGRES_DB: samachar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U samachar"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://samachar:samachar@db:5432/samachar"
      REDIS_URL: "redis://redis:6379/0"
      CORS_ORIGINS: "http://localhost:8000,http://localhost:3000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.secret_key:/app/.secret_key

volumes:
  pgdata:
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "samachar-news"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138",
    "uvicorn>=0.49",
    "gunicorn>=26",
    "sqlalchemy>=2.0",
    "alembic>=1.18",
    "aiosqlite>=0.22",
    "asyncpg>=0.31",
    "redis>=8.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-jose>=3.5",
    "bcrypt>=4.1,<4.2",
    "httpx>=0.28",
    "feedparser>=6.0",
    "python-multipart>=0.0.18",
    "structlog>=26.1",
    "sentry-sdk>=2.64",
    "prometheus-client>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[tool.ruff]
target-version = "py311"
line-length = 140
lint.select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/*" = ["E402", "W291"]
"backend/services/news_service.py" = ["E501"]
"backend/app.py" = ["E402", "E722"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

services:
  - type: web
    name: samachar-news-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SAMACHAR_ENV
        value: production
      - key: SAMACHAR_JWT_SECRET
        generateValue: true
      - key: SAMACHAR_DATABASE_URL
        value: sqlite+aiosqlite:///./samachar.db
